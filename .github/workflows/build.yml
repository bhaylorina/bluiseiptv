name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 🔥 Manual button idhar hi hai

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔥 Isse GitHub ko pata chalega ki code BluiseIPTV folder me hai
    defaults:
      run:
        working-directory: ./BluiseIPTV 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bluise-iptv-debug-apk
        path: BluiseIPTV/app/build/outputs/apk/debug/app-debug.apk
        
