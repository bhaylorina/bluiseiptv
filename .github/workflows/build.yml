name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Android SDK 37 Canary
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "Installing Android SDK 37..."

        yes | sdkmanager --licenses || true

        sdkmanager --channel=3 "platforms;android-37.0"

        echo "Installed SDK platforms:"
        ls -la "$ANDROID_HOME/platforms"

    - name: Create Android 37 SDK Alias
      run: |
        if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
        fi

        echo "Android SDK 37 paths:"
        ls -la "$ANDROID_HOME/platforms" | grep android-37

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: BluiseIPTV

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: BluiseIPTV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bluise-iptv-debug-apk
        path: BluiseIPTV/app/build/outputs/apk/debug/app-debug.apk
