name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set ANDROID_HOME
      run: echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV

    - name: Accept ALL SDK Licenses (force yes)
      run: |
        yes | sdkmanager --licenses --sdk_root=${{ env.ANDROID_HOME }} > /dev/null || true
        yes | sdkmanager --licenses --sdk_root=${{ env.ANDROID_HOME }} || true

    - name: Install Android SDK Platform 37 (Canary Channel)
      run: |
        sdkmanager --sdk_root=${{ env.ANDROID_HOME }} --channel=3 "platforms;android-37"
        sdkmanager --sdk_root=${{ env.ANDROID_HOME }} --channel=3 "build-tools;37.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bluise-iptv-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
