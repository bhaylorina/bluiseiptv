name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 🔥 Iski wajah se 'Run workflow' ka manual button aayega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 🔥 AAPKA LOGIC: Install API 37 SDK on GitHub Runner 🔥
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Platform 37
      run: sdkmanager "platforms;android-37"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bluise-iptv-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
