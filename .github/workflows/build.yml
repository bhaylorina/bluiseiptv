name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK Tools
      run: |
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

    - name: Install Android SDK 37
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

        echo "Accepting Android SDK licenses..."
        yes | "$SDKMANAGER" --licenses || true

        echo "Searching Android 37 packages..."
        "$SDKMANAGER" --list --channel=3 | grep -E "android-37|build-tools;37" || true

        echo "Installing Android 37.0..."
        "$SDKMANAGER" --channel=3 "platforms;android-37.0"

        echo "Aligning Android 37 folder and metadata..."

        mv "$ANDROID_HOME/platforms/android-37.0" \
           "$ANDROID_HOME/platforms/android-37"

        sed -i 's/android-37\.0/android-37/g' \
          "$ANDROID_HOME/platforms/android-37/source.properties" || true

        sed -i 's/android-37\.0/android-37/g' \
          "$ANDROID_HOME/platforms/android-37/package.xml" || true

        echo "Installed Android platforms:"
        ls -la "$ANDROID_HOME/platforms"

        echo "Android 37 folder:"
        ls -ld "$ANDROID_HOME/platforms/android-37"

        echo "Checking android.jar:"
        test -f "$ANDROID_HOME/platforms/android-37/android.jar"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: BluiseIPTV

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: BluiseIPTV
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bluise-iptv-debug-apk
        path: BluiseIPTV/app/build/outputs/apk/debug/app-debug.apk
