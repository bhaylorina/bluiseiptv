plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bluise.iptv'
    compileSdk 37

    defaultConfig {
        applicationId "com.bluise.iptv.new"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "2.0"
        resConfigs "en"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("my-release-key.jks")
            storePassword "123456"
            keyAlias "my-alias"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'

    implementation 'com.github.bumptech.glide:glide:5.0.9'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    def media3_version = "1.11.1"

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.1'

    // WireGuard userspace tunnel
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // Required by WireGuard tunnel library
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
