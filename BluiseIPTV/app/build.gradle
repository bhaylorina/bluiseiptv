plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bluise.iptv'
    compileSdk 36 // 🔥 Updated to latest API 36

    defaultConfig {
        applicationId "com.bluise.iptv.new"
        minSdk 24
        targetSdk 36 // 🔥 Updated to latest API 36
        versionCode 2
        versionName "2.0"
        resConfigs "en"

        // THE MAGIC DIET PILL: x86 aur x86_64 ko nikal diya (Saves 10-15 MB)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("my-release-key.jks")
            storePassword "123456" 
            keyAlias "my-alias"
            keyPassword "123456" 
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core UI (Already Latest Stable)
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // =========================
    // 🔥 MEDIA3 (UPDATED TO LATEST 1.11.1) 🔥
    // =========================
    def media3_version = "1.11.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

    // =========================
    // 🔥 OKHTTP (UPDATED TO LATEST STABLE 5.5.1) 🔥
    // =========================
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.1'
}
